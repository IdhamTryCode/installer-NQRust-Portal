name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: nqrust-portal
  ARCH: amd64

permissions:
  contents: write

jobs:
  build-and-release-linux:
    name: Build & Release (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          DEB_FILE=$(ls target/debian/*.deb | head -n 1)
          tar -C target/release -czf dist/${BIN_NAME}-linux-amd64.tar.gz ${BIN_NAME}
          cp target/release/${BIN_NAME} dist/${BIN_NAME}-linux-amd64
          cp "${DEB_FILE}" dist/
          cp "${DEB_FILE}" dist/${BIN_NAME}_${ARCH}.deb
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
