[package]
name = "installer-nqrust-portal"
version = "0.0.1"
description = "Interactive TUI installer for NQRust Identity Portal"
authors = ["Idham <idhammultazam7@gmail.com>"]
license = "MIT"
edition = "2024"

[[bin]]
name = "nqrust-portal"
path = "src/main.rs"

[dependencies]
ratatui = "0.29.0"
color-eyre = "0.6.3"
crossterm = "0.28.1"
tokio = { version = "1.42.0", features = ["full"] }
futures = "0.3.31"
uuid = { version = "1.11.0", features = ["v4"] }
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.8"
indicatif = "0.17"
sha2 = "0.10"

[package.metadata.deb]
name = "nqrust-portal"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/nqrust-portal", "usr/bin/nqrust-portal", "755"],
]
