services:
  traefik:
    image: traefik:v3.4
    container_name: nqrust-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.identitysecure.address=:8444
    ports:
      - "${PORTAL_PORT:-8083}:443"
      - "${IDENTITY_PORT:-8082}:8444"
      - "8081:8080"
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro

  identity-db:
    image: postgres:16-alpine
    container_name: nqrust-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-${KEYCLOAK_DB_NAME:-identity}}
      POSTGRES_USER: ${IDENTITY_DB_USER:-${KEYCLOAK_DB_USER:-identity}}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-${KEYCLOAK_DB_PASSWORD:-identity}}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-${KEYCLOAK_DB_USER:-identity}} -d ${IDENTITY_DB_NAME:-${KEYCLOAK_DB_NAME:-identity}}"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity:
    image: ghcr.io/nexusquantum/nqrust-identity:latest
    container_name: nqrust-identity
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-identity}
      KC_DB: postgres
      KC_DB_USERNAME: ${IDENTITY_DB_USER:-${KEYCLOAK_DB_USER:-identity}}
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-${KEYCLOAK_DB_PASSWORD:-identity}}
      KC_DB_URL_HOST: identity-db
      KC_DB_URL_DATABASE: ${IDENTITY_DB_NAME:-${KEYCLOAK_DB_NAME:-identity}}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_HOST:-http://localhost:8082}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_THEME_DEFAULT: ${KC_THEME_DEFAULT:-keycloakify-starter}
      KC_THEME_WELCOME: ${KC_THEME_WELCOME:-keycloak}
    command: >
      start --http-enabled=true --hostname-strict=false
      --features=admin-fine-grained-authz,token-exchange,docker,scripts
      --spi-theme--default=${KC_THEME_DEFAULT:-keycloakify-starter}
      --spi-theme--welcome-theme=${KC_THEME_WELCOME:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  portal:
    image: ghcr.io/nexusquantum/nqrust-identity-portal:latest
    container_name: nqrust-identity-portal
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env

volumes:
  identity-db-data:
