http:
  routers:
    # Portal HTTPS (public paths, no license check)
    portal-public:
      rule: PathPrefix(`/license-activation`) || PathPrefix(`/_next`) || PathPrefix(`/images`) || Path(`/favicon.ico`) || PathPrefix(`/api/auth`) || PathPrefix(`/api/license-gate`) || PathPrefix(`/api/license`)
      entryPoints:
        - websecure
      priority: 100
      service: portal-svc
      tls: {}

    # Portal HTTPS (protected)
    portal-protected:
      rule: PathPrefix(`/`)
      entryPoints:
        - websecure
      priority: 1
      middlewares:
        - license-auth
      service: portal-svc
      tls: {}

    # Identity HTTPS routers
    identity-realms:
      rule: PathPrefix(`/realms`)
      entryPoints:
        - identitysecure
      priority: 100
      middlewares:
        - license-auth
      service: identity-svc
      tls: {}

    identity-admin:
      rule: PathPrefix(`/admin`)
      entryPoints:
        - identitysecure
      priority: 100
      middlewares:
        - license-auth
      service: identity-svc
      tls: {}

    identity-resources:
      rule: PathPrefix(`/resources`)
      entryPoints:
        - identitysecure
      priority: 99
      middlewares:
        - license-auth
      service: identity-svc
      tls: {}

    identity-root:
      rule: Path(`/`)
      entryPoints:
        - identitysecure
      priority: 98
      middlewares:
        - license-auth
        - identity-root-redirect
      service: noop@internal
      tls: {}

  middlewares:
    # Host port must match docker-compose `IDENTITY_PORT` (default 8082 → host:8082 → container :8444).
    identity-root-redirect:
      redirectRegex:
        regex: ^https?://([^/:]+)(:\d+)?/?$
        replacement: https://${1}:8082/admin/master/console/
        permanent: false

    license-auth:
      forwardAuth:
        address: http://portal:3005/api/license-gate
        trustForwardHeader: true

  services:
    portal-svc:
      loadBalancer:
        servers:
          - url: http://portal:3005

    identity-svc:
      loadBalancer:
        servers:
          - url: http://identity:8080

tls:
  certificates:
    - certFile: /etc/traefik/certs/server.crt
      keyFile: /etc/traefik/certs/server.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/server.crt
        keyFile: /etc/traefik/certs/server.key
